# INFO: Modified version of the default stock configuration from hypr-wiki.


general {
    lock_cmd = pidof ~/.config/qylock/lock.sh || ~/.config/qylock/lock.sh       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 210                                # 2.5min.
    on-timeout = brightnessctl -s set 1 && notify-send -i 'stacer' 'Fist my bump!' "Idle activity detected." # set monitor backlight to minimum.
    on-resume = brightnessctl -r && notify-send -i 'sgt-mines' 'Welcome Back!' "Wake-up initialised." # monitor backlight restore.
}

listener {
    timeout = 600                                 # 10min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}

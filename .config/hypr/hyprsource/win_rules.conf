# Rules for individual windows in Hyprland DE
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more



#  ┏┓┓ ┏┓┏┓┳┓┳┏┳┓┏┳┓┓┏
#  ┣┫┃ ┣┫┃ ┣┫┃ ┃  ┃ ┗┫
#  ┛┗┗┛┛┗┗┛┛┗┻ ┻  ┻ ┗┛
# Rules for erminal [WORKING]
windowrule {
    name = alacritty
    pseudo = on
    center = on
    size = 1138 715
    match:class = Alacritty
    match:workspace = w[t0]
}


#  ┏┓┏┓┏┓┏┓┳┓┏┓
#  ┃┃┣┫┃┃┣ ┣┫┗┓
#  ┣┛┛┗┣┛┗┛┛┗┗┛
# Rules for papers [WORKING]
windowrule {
    name = papers
    float = on
    center = on
    size = 1330 734
    match:class = org.gnome.Evince
}


#  ┓┏┏┳┓ ┳┳┓┳┳┏┓┳┏┓
#  ┗┫ ┃  ┃┃┃┃┃┗┓┃┃ 
#  ┗┛ ┻  ┛ ┗┗┛┗┛┻┗┛
# Rules for YouTube Music [WORKING]
windowrule {
    name = yt-music
    float = on
    animation = slide right
    move = 1129 60
    size = 517 817
    match:initial_title = YouTube Music
}

#  ┏┓┏┓┏┓┓┏ ┏┓┏┓┏┓┏┓┏┓┏┳┓┏┓
#  ┣ ┣┫┗┓┗┫ ┣ ┣ ┣ ┣ ┃  ┃ ┗┓
#  ┗┛┛┗┗┛┗┛ ┗┛┻ ┻ ┗┛┗┛ ┻ ┗┛
# Rules for Easy Effects
windowrule {
    name = easyeffects
    float = on
    animation = slide left
    move = 24 60
    size = 1076 817
    match:class = org.kde.easyeffects
}


#  ┳┳┓ ┏┓┳┳┳┓┏┓┓┏┏┓┳┓
#  ┃┃┃ ┣┫┃┃┃┃┃ ┣┫┣ ┣┫
#  ┗┛┗┛┛┗┗┛┛┗┗┛┛┗┗┛┛┗
# Rules for ulauncher [WORKING]
windowrule {
    name = ulauncher
    float = on
    pin = on
    animation = gnomed
    stay_focused = on
    match:class = ulauncher
}


#  ┏┓┏┓┳┓┏┓
#   ┃┃ ┃┃┃┓
#  ┗┛┗┛┻┛┗┛
# Rules for xdg-desktop-portal-gtk [WORKING]
windowrule {
    name = xdg-desktop-portal-gtk
    float = on
    center = on
    size = 1120 650
    match:class = xdg-desktop-portal-gtk
}


#  ┳┓┏┓┳┳┏┳┓┳┓ ┳┳┏┓
#  ┃┃┣┫┃┃ ┃ ┃┃ ┃┃┗┓
#  ┛┗┛┗┗┛ ┻ ┻┗┛┗┛┗┛
# Rules for Nautilus [WORKING]
# File Dialogs (open, save, etc.) are now managed by xdg-desktop-portal-gtk
windowrule {
    name = nautilus
    pseudo = on
    center = on
    size = 1120 650
    match:class = org.gnome.Nautilus
    match:workspace = w[t0]
}

# Rules for File Roller [WORKING]
windowrule {
    name = file-roller
    float = on
    center = on
    size = 1120 650
    match:class = org.gnome.FileRoller
}


#  ┳┓┏┓┏┓┳
#  ┣┫┃┃┣ ┃
#  ┛┗┗┛┻ ┻
# Rules for rofi scripts [WORKING]
windowrule {
    name = rofi
    float = on
    center = on
    match:class = Rofi
}


#  ┓ ┏┏┓┓┏┏┓┏┓┏┓┏┓┳┓
#  ┃┃┃┣┫┗┫┃┃┣┫┃┃┣ ┣┫
#  ┗┻┛┛┗┗┛┣┛┛┗┣┛┗┛┛┗
# Rules for Waypaper [WORKING]
windowrule {
    name = waypaper
    float = on
    move = 827 277
    size = 820 600
    animation = slide right
    match:class = waypaper
}


#  ┓ ┏┳┳┓┳┓┏┓┏┓┳┓┳┳┓┏┓
#  ┃┃┃┃┃┃┃┃┗┓┃ ┣┫┃┣┫┣ 
#  ┗┻┛┻┛┗┻┛┗┛┗┛┛┗┻┻┛┗┛
# Rules for Windscribe [WORKING]
windowrule {
    name = windscribe
    float = on
    center = on
    match:class = Windscribe
}

#  ┏┓┏┓┓ ┳┏┓┏┳┓┏┓
#  ┣ ┃┃┃ ┃┣┫ ┃ ┣ 
#  ┻ ┗┛┗┛┻┛┗ ┻ ┗┛
# Rules for Foliate [WORKING]
windowrule {
    name = foliate
    pseudo = on
    center = on
    size = 1068 768
    match:class = com.github.johnfactotum.Foliate
}


#  ┏┓┏┓┓ ┏┓┳┓┳┳┳┳┓
#  ┗┓┃┃┃ ┣┫┃┃┃┃┃┃┃
#  ┗┛┗┛┗┛┛┗┛┗┗┛┛ ┗
# Rules for Solanum (GNOME Pomodoro) [WORKING]
windowrule {
    name = solanum
    pseudo = on
    center = on
    size = 1100 808
    match:class = org.gnome.Solanum
}


#  ┓ ┏┏┓┓┏ ┳┓┳┓┏┓┳┳┓
#  ┃┃┃┣┫┗┫ ┃┃┣┫┃┃┃┃┃
#  ┗┻┛┛┗┗┛ ┻┛┛┗┗┛┻┻┛
# Rules for Waydroid [NOT-WORKING]
windowrule {
    name = waydroid
    opacity = "1.0 override"
    match:class = ^(Waydroid|waydroid\..*)$
}



#  ┓ ┏┓┓┏┏┓┳┓┏┓
#  ┃ ┣┫┗┫┣ ┣┫┗┓
#  ┗┛┛┗┗┛┗┛┛┗┗┛
# Rules for various layers under same category

layerrule {
    name = hypr-dock
    blur = on
    ignore_alpha = 0.5
    animation = slide bottom
    match:namespace = hypr-dock
}

layerrule {
    name = hypr-dock (popup)
    blur = off
    ignore_alpha = 0
    animation = slide bottom
    match:namespace = dock-popup
}

layerrule {
    name = waybar
    blur = on
    animation = slide
    blur_popups = on
    match:namespace = waybar
}

layerrule {
    name = awww-daemon
    animation = fade
    match:namespace = awww-daemon
}

layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0.3
    animation = slide bottom
    match:namespace = vicinae
}

layerrule {
    name = fuzzel
    blur = on
    ignore_alpha = 0.3
    animation = slide bottom
    match:namespace = fuzzel
}

layerrule {
    name = swaync-control-center
    blur = on
    ignore_alpha = 0.3
    animation = slide right
    match:namespace = swaync-control-center
}

layerrule {
    name = swaync-notification-window
    blur = on
    ignore_alpha = 0.3
    animation = slide right
    match:namespace = swaync-notification-window
}

layerrule {
    name = gtk-layer-shell
    blur = on
    ignore_alpha = 0.5
    animation = fade
    match:namespace = gtk-layer-shell
}

layerrule {
    name = swayosd
    blur = on
    ignore_alpha = 0.5
    animation = slide bottom
    match:namespace = swayosd
}

layerrule {
    name = tofi-drun
    blur = on
    animation = slide bottom
    match:namespace = tofi-drun
}

layerrule {
    name = nwg-drawer
    blur = on
    animation = slide bottom
    match:namespace = nwg-drawer
}

layerrule {
    name = snappy-switcher
    blur = on
    animation = slide top
    match:namespace = snappy-switcher
}

layerrule {
    name = hyprpicker
    no_anim = on
    match:namespace = hyprpicker
}

layerrule {
    name = selection
    no_anim = on
    match:namespace = selection
}
